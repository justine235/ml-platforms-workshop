# Submits the Azure ML training pipeline. Manual run; add a schedule once the workspace exists.
# Off until ENABLE_AZURE_DEPLOY=true and the OIDC variables are set. Prerequisite: step 2 of 05-demo-azureml-e2e/rebuild-guide.md.
name: aml-train-pipeline

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  train:
    if: ${{ vars.ENABLE_AZURE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az extension add -n ml --upgrade
      - run: >
          az ml job create
          --file 05-demo-azureml-e2e/jobs/pipeline-train.yml
          --set inputs.git_sha=${{ github.sha }}
          --resource-group rg-fleet-aml-dev
          --workspace-name mlw-fleet-dev

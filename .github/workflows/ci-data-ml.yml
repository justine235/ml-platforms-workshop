name: ci-data-ml

# The heavy jobs, all local (no tenant, no cloud account): the 04 ETL notebooks on local Spark, the 04 Fabric ML kit,
# and the ETL-to-ML integration check. They run only when the data, the Fabric kits or their requirements change,
# so a push that touches slides or docs does not spend the minutes. Run it by hand from the Actions tab at any time.

on:
  push:
    branches: [main]
    paths:
      - "02-demo-data/**"
      - "04-demo-fabric-e2e/**"
      - "ci/assert_etl_results.py"
      - "ci/requirements/**"
      - ".github/workflows/ci-data-ml.yml"
  pull_request:
    paths:
      - "02-demo-data/**"
      - "04-demo-fabric-e2e/**"
      - "ci/assert_etl_results.py"
      - "ci/requirements/**"
      - ".github/workflows/ci-data-ml.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-data-ml-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  etl:
    name: 04 ETL on Spark ${{ matrix.spark }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fabric Runtime 1.3 is Spark 3.5 and Delta 3.2; Runtime 2.0 is Spark 4.1, Delta 4.2 and Java 21.
          - spark: "3.5"
            java: "17"
            requirements: requirements-spark35.txt
          - spark: "4.1"
            java: "21"
            requirements: requirements-spark4.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # pyspark is a source distribution of about 450 MB: the pip cache keeps the wheel built on the first run.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: 04-demo-fabric-e2e/etl/local-validation/${{ matrix.requirements }}
      - name: Install PySpark, Delta Lake and pandas
        run: python -m pip install -r 04-demo-fabric-e2e/etl/local-validation/${{ matrix.requirements }}
      - name: Generate the synthetic data
        run: python 02-demo-data/fleet_data_generator.py --out 02-demo-data/data --truth-dir 02-demo-data/truth --with-drift
      - name: Run the four ETL notebooks on local Spark
        working-directory: 04-demo-fabric-e2e/etl/local-validation
        run: python run_local.py
      - name: Compare the lakehouse tables with the ground truth
        working-directory: 04-demo-fabric-e2e/etl/local-validation
        run: python compare_ground_truth.py
      - name: Assert Delta storage and all 39 checks
        run: python ci/assert_etl_results.py --spark ${{ matrix.spark }}
      - name: Job summary
        if: always()
        run: |
          {
            echo "### ETL ground-truth checks on Spark ${{ matrix.spark }}"
            cat 04-demo-fabric-e2e/etl/local-validation/results/ground-truth-compare.md 2>/dev/null || echo "No comparison table was produced."
          } >> "$GITHUB_STEP_SUMMARY"
      # The integration job reads these Delta tables.
      - uses: actions/upload-artifact@v4
        with:
          name: etl-lakehouse-spark-${{ matrix.spark }}
          path: 04-demo-fabric-e2e/etl/local-validation/artifacts/lh_fleet
          retention-days: 1
          if-no-files-found: error

  ml-mlops:
    name: 04 Fabric ML kit, ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Runtime 2.0 library set
            python: "3.13"
            requirements: ml-mlops.txt
    defaults:
      run:
        working-directory: 04-demo-fabric-e2e/ml-mlops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ci/requirements/${{ matrix.requirements }}
      - run: python -m pip install -r ../../ci/requirements/${{ matrix.requirements }}
      - run: python -m pytest -q -p no:cacheprovider
      # The generated ipynb files carry random cell ids, so only the Fabric Git items are compared.
      - name: Fabric Git items are up to date with the notebook sources
        if: matrix.python == '3.13'
        run: |
          python tools/build_notebooks.py
          changes=$(git status --porcelain -- fabric-git ../etl/fabric-git)
          if [ -n "$changes" ]; then
            echo "$changes"
            git --no-pager diff --stat -- fabric-git ../etl/fabric-git
            echo "::error::Run python tools/build_notebooks.py in 04-demo-fabric-e2e/ml-mlops and commit the result."
            exit 1
          fi
      - name: Local run on pandas tables, against the frozen contract
        run: python local-validation/run_local.py
      - run: python local-validation/compare_ground_truth.py
      - name: Fabric simulation (the generated notebooks, fake Spark)
        run: python local-validation/fabric_sim.py

  integration:
    name: 04 ETL tables to ML, ${{ matrix.label }}
    needs: etl
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: tables written by Spark 3.5
            spark: "3.5"
          - label: tables written by Spark 4.1
            spark: "4.1"
    defaults:
      run:
        working-directory: 04-demo-fabric-e2e/ml-mlops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ci/requirements/ml-mlops.txt
      - run: python -m pip install -r ../../ci/requirements/ml-mlops.txt
      - uses: actions/download-artifact@v4
        with:
          name: etl-lakehouse-spark-${{ matrix.spark }}
          path: 04-demo-fabric-e2e/etl/local-validation/artifacts/lh_fleet
      - name: Feed the ETL Delta tables to the ML notebooks (14 checks)
        run: python local-validation/integration_etl_to_ml.py

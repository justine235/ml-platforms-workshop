name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# One job per module, so a failure points at one folder. The heavy jobs (04 ETL on local Spark, the 04 Fabric ML kit and
# the ETL-to-ML integration check) are in ci-data-ml.yml, which runs only when the data or the Fabric kits change.
jobs:
  static:
    name: static (ruff, YAML/JSON/notebooks, neutrality, Fabric Git)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.17.0 pyyaml nbformat
      - run: ruff check --no-cache .
      - run: python ci/static_checks.py
      - run: python 04-demo-fabric-e2e/tools/check_fabric_git.py --list

  deck:
    name: 01 deck (strict build)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: 01-slides
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r ../ci/requirements/deck.txt
      # The builder measures text with the Windows fonts, hence a Windows runner.
      - name: Strict build
        run: |
          set -o pipefail
          python build_deck.py --out out/strict 2>&1 | tee build.log
          grep -q 'RESULT: clean' build.log
      - uses: actions/upload-artifact@v4
        with:
          name: decks
          path: 01-slides/out/strict/*.pptx
          if-no-files-found: error

  mlflow-tour:
    name: 03 MLflow tour (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r ci/requirements/mlflow-tour.txt
      - run: python -m pytest -q -p no:cacheprovider 03-demo-mlflow-tour/tests

  infra:
    name: infra (Bicep compile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install
      # The root template pulls in the Azure ML modules of 05 and the Foundry and Fabric modules.
      - name: Compile the template and its parameters
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/main.bicepparam --stdout > /dev/null

  aml:
    name: 05 Azure ML kit (tests, SDK loaders, Bicep, local run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 05-demo-azureml-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-local.txt
      - run: python -m py_compile src/*.py src/etl_on_aml/*.py sdk/*.py local-validation/*.py
      - run: ruff check src tests sdk local-validation
      - run: pytest -q tests
      # Loads every YAML with the real azure-ai-ml loaders and builds the SDK pipeline (offline).
      - run: python local-validation/validate_with_sdk_loaders.py
      - run: az bicep install
      - name: Compile every Bicep file
        run: |
          status=0
          for f in $(find infra -name '*.bicep' | sort); do
            echo "bicep build $f"
            az bicep build --file "$f" --stdout > /dev/null || status=1
          done
          exit $status
      - run: python local-validation/run_local.py

  foundry:
    name: 06 Foundry data agent kit (tests, example SQL, offline eval, agent dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 06-demo-foundry-data-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ci/requirements/foundry.txt
      - run: python -m pip install -r ../ci/requirements/foundry.txt
      - run: python -m pytest tests -q -p no:cacheprovider
      # Every example query of the data agent parses and returns the expected rows on the reference tables.
      - run: python data-agent/validate_examples.py
      # The offline eval: the agent that knows the schema passes all 30 questions (the naive one fails them on purpose).
      - run: python foundry-agent/eval_harness.py --agent oracle
      # Builds the agent definition without calling Azure.
      - run: python foundry-agent/create_agent.py --dry-run

[tool.ruff]
line-length = 160
target-version = "py310"
exclude = [
  "notebooks/shared",
  "notebooks/generated-ipynb",
  "fabric-git",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E402"]
"local-validation/run_local.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["local-validation/tests"]

$schema: https://azuremlschemas.azureedge.net/latest/schedule.schema.json
name: fleet_daily_retraining
display_name: Fleet daily retraining
description: Retrain the fleet-failure-7d pipeline every weekday morning.
trigger:
  type: recurrence
  frequency: week
  interval: 1
  schedule:
    week_days: [monday, tuesday, wednesday, thursday, friday]
    hours: [6]
    minutes: [0]
  time_zone: W. Europe Standard Time
create_job: ./pipeline-train.yml
